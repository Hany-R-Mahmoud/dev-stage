<!doctype html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emojie-Crack — campaign artwork</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#212936; --paper:#fffaf0; --purple:#8059ed; --yellow:#f6c44a; }
    * { box-sizing:border-box; }
    body { margin:0; width:1280px; background:var(--paper); color:var(--ink); font-family:'Cairo',sans-serif; }
    .canvas { position:relative; width:1280px; height:800px; overflow:hidden; padding:54px 62px; background:var(--paper); }
    .canvas:before { content:''; position:absolute; width:650px; height:650px; border-radius:50%; background:#ece2ff; top:190px; left:-270px; }
    .canvas:after { content:''; position:absolute; width:330px; height:330px; border-radius:50%; background:var(--yellow); top:-225px; right:245px; }
    header,main,footer { position:relative; z-index:1; }
    header { display:flex; justify-content:space-between; align-items:center; }
    .identity { display:flex; align-items:center; gap:14px; }
    .logo { width:84px; height:84px; object-fit:contain; }
    .brand { font-family:'Outfit',sans-serif; font-size:27px; font-weight:800; letter-spacing:-.8px; }
    .subbrand { font-size:13px; font-family:'Outfit',sans-serif; letter-spacing:2px; margin-top:6px; }
    .label { border:2px solid var(--ink); border-radius:99px; padding:8px 22px; font-size:15px; font-weight:800; background:#fff; }
    main { display:grid; grid-template-columns:640px 1fr; gap:45px; align-items:center; margin-top:42px; }
    .product { border:3px solid var(--ink); border-radius:23px; background:#fff; box-shadow:10px 10px 0 var(--ink); overflow:hidden; transform:rotate(-2deg); }
    .chrome { height:34px; background:var(--purple); border-bottom:3px solid var(--ink); display:flex; align-items:center; gap:6px; padding:0 14px; }
    .chrome i { width:7px; height:7px; border:1.5px solid var(--ink); border-radius:50%; background:var(--paper); }
    .chrome span { margin-left:auto; font-family:'Outfit'; font-size:10px; letter-spacing:1px; color:white; }
    .product img { display:block; width:100%; height:auto; }
    .caption { font-size:12px; padding:12px 18px; border-top:2px solid var(--ink); background:#fff; font-weight:800; text-align:center; }
    .copy { direction:rtl; }
    .eyebrow { font-size:15px; font-weight:800; color:#5b31bd; }
    h1 { font-size:61px; line-height:1.38; letter-spacing:-2px; margin:15px 0 18px; font-weight:900; }
    h1 em { font-style:normal; display:inline-block; background:var(--yellow); padding:0 12px 5px; transform:rotate(2deg); border:2px solid var(--ink); border-radius:10px; }
    .description { font-size:20px; line-height:1.9; margin:0; font-weight:700; }
    .tags { margin-top:24px; display:flex; flex-wrap:wrap; gap:8px; }
    .tags span { font-size:13px; border:2px solid var(--ink); background:#fff; border-radius:99px; padding:5px 14px; font-weight:800; }
    footer { position:absolute; bottom:45px; left:62px; right:62px; display:flex; align-items:center; justify-content:space-between; border-top:2px solid var(--ink); padding-top:22px; }
    .url { font-family:'Outfit'; font-size:20px; font-weight:700; }
    .cta { background:var(--purple); color:#fff; border:2px solid var(--ink); border-radius:99px; padding:9px 26px; font-size:18px; font-weight:800; box-shadow:4px 4px 0 var(--ink); }
    body.square,body.story { width:1080px; }
    .square .canvas { width:1080px; height:1080px; padding:65px 75px; }
    .square main,.story main { display:flex; flex-direction:column-reverse; gap:30px; margin-top:22px; }
    .square .copy,.story .copy { width:100%; text-align:center; }
    .square h1 { font-size:66px; margin:9px 0; }
    .square h1 br { display:none; }
    .square .description { font-size:22px; }
    .square .tags,.story .tags { justify-content:center; margin-top:13px; }
    .square .product { width:620px; transform:rotate(-1.5deg); }
    .square footer { left:75px; right:75px; bottom:48px; }
    .story .canvas { width:1080px; height:1920px; padding:135px 90px; }
    .story header { margin-bottom:60px; }
    .story .brand { font-size:35px; }
    .story .logo { width:110px; height:110px; }
    .story h1 { font-size:92px; line-height:1.5; margin:20px 0; }
    .story .description { font-size:30px; }
    .story .eyebrow { font-size:23px; }
    .story .tags span { font-size:21px; }
    .story .product { width:820px; margin-top:35px; }
    .story .caption { font-size:19px; padding:20px; }
    .story .chrome { height:47px; }
    .story footer { flex-direction:column; gap:25px; left:90px; right:90px; bottom:180px; padding-top:40px; }
    .story .cta { font-size:35px; padding:15px 60px; }
    .story .url { font-size:28px; }
  </style>
</head>
<body>
  <article class="canvas">
    <header>
      <div class="identity"><img class="logo" src="/projects/emojie-crack/logo.png" alt="شعار إيموجي كراك"><div><div class="brand">Emojie-Crack</div><div class="subbrand">EGYPTIAN EMOJI PUZZLES</div></div></div>
      <div class="label" dir="rtl">ألغاز بطعم مصري 🇪🇬</div>
    </header>
    <main>
      <div class="product"><div class="chrome"><i></i><i></i><i></i><span>REAL GAMEPLAY / GUEST MODE</span></div><img src="/projects/emojie-crack/gameplay.jpg" alt="لقطة حقيقية من لغز إيموجي كراك"><div class="caption" dir="rtl">شوف الإيموجي. اربط المعنى. فك الشفرة.</div></div>
      <div class="copy"><div class="eyebrow">تحدّي ثقافتك المصرية</div><h1>الإيموجي يقولها.<br><em>إنت تفكّها؟</em></h1><p class="description">أمثال، أفلام، أكلات وترندات.<br>كل لغز حكاية تعرفها.</p><div class="tags"><span>ألغاز بالعربي</span><span>جرّب كضيف</span><span>تلميحات وقت اللزوم</span></div></div>
    </main>
    <footer><span class="url">emojie-crack.vercel.app</span><span class="cta" dir="rtl">فك أول لغز ←</span></footer>
  </article>
  <script>const format=new URLSearchParams(location.search).get('format');if(['square','story'].includes(format))document.body.classList.add(format);</script>
</body>
</html>
